<header class="top-header">
  <div class="header-context">
    <button
      class="menu-button"
      type="button"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="isMobile() ? mobileSidebarOpen() : !sidebarCollapsed()"
      [attr.aria-label]="menuLabel()"
      (click)="menuToggle.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <div class="title-group">
      <span>{{ language.translate('header.context') }}</span>
      <h1>{{ pageTitle() }}</h1>
    </div>
  </div>

  <div class="header-actions">
    <p class="header-subtitle">{{ language.translate('header.subtitle') }}</p>

    <button
      class="language-button"
      type="button"
      [attr.aria-label]="language.translate('common.switchLanguage')"
      [attr.title]="language.translate('common.switchLanguage')"
      (click)="language.toggle()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3Z" />
      </svg>
      <span>{{ language.language() === 'ar' ? 'EN' : 'ع' }}</span>
    </button>
  </div>
</header>
